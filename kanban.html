<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 2 · Kanban board</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/kanban.js" defer></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="container">
    <a class="brand" href="index.html">JS Lab · Assignment 5</a>
    <nav class="nav" aria-label="Main">
      <a href="index.html">Home</a>
      <a href="game.html">1. Game</a>
      <a href="kanban.html" aria-current="page">2. Kanban</a>
      <a href="tickets.html">3. Tickets</a>
    </nav>
  </div>
</header>
<main id="main" class="container">
  <h1>Kanban board</h1>
  <p class="lead">Move cards with the buttons. The "In progress" column holds at most 3 cards.</p>

  <div class="toolbar">
    <div class="field"><label for="search">Search by title</label><input id="search" type="search" placeholder="e.g. form" autocomplete="off"></div>
    <div class="field"><label for="tag-filter">Tag</label><select id="tag-filter"></select></div>
    <div class="field"><label for="sort">Sort by</label>
      <select id="sort">
        <option value="default">Board order</option>
        <option value="priority">Priority (high first)</option>
      </select></div>
    <button type="button" class="btn" id="clear-filters">Clear filters</button>
  </div>

  <div class="progress-box">
    <label for="progress">Progress: <span id="progress-text"></span></label>
    <progress id="progress" value="0" max="1"></progress>
  </div>

  <p id="message" class="notice" role="status" aria-live="polite"></p>
  <p id="empty-state" class="empty" hidden></p>

  <div id="board" class="board"></div>

  <section class="card section-gap" aria-labelledby="add-title">
    <h2 id="add-title">Add a card</h2>
    <form id="add-form" class="add-form" novalidate>
      <div class="field"><label for="new-title">Title</label><input id="new-title" required minlength="3" maxlength="40" autocomplete="off"></div>
      <div class="field"><label for="new-tag">Tag</label><select id="new-tag"></select></div>
      <div class="field"><label for="new-priority">Priority</label>
        <select id="new-priority"><option value="1">1 · High</option><option value="2" selected>2 · Medium</option><option value="3">3 · Low</option></select></div>
      <div class="field"><label for="new-hours">Hours</label><input id="new-hours" type="number" min="1" max="20" value="2"></div>
      <div class="field"><label>&nbsp;</label><button type="submit" class="btn btn-primary">Add card</button></div>
    </form>
    <p id="add-error" class="error-msg" role="alert"></p>
  </section>
</main>
<footer class="site-footer"><div class="container">Orynbassar Abdullakh · Group IT 2510 · WEB Technologies 1</div></footer>
</body>
</html>
